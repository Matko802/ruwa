<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="panel.css" />
</head>
<body>
<header>
  <strong>Ruwa Settings</strong>
</header>
<nav id="tabs" role="tablist" aria-label="Settings sections">
  <button role="tab" data-tab="general" class="active" aria-selected="true">General</button>
  <button role="tab" data-tab="appearance" aria-selected="false">Appearance</button>
  <button role="tab" data-tab="plugins" aria-selected="false">plugins</button>
  <button role="tab" data-tab="system" aria-selected="false">System</button>
  <div id="tab-indicator"></div>
</nav>
<div id="status">Changes apply on next launch.</div>
<main>
  <section data-page="general">
    <div class="card caption">Behavior</div>
    <label class="row"><span>Keep running in tray when window closes</span><input type="checkbox" id="closeToTray" /></label>
    <label class="row"><span>Start minimized to tray</span><input type="checkbox" id="startMinimized" /></label>
    <div class="row"><span>Display backend</span>
      <div class="m3-field" id="displayField" role="listbox" tabindex="0" aria-label="Display backend" aria-expanded="false">
        <span id="displayValue"></span>
        <svg class="trail" viewBox="0 0 24 24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/></svg>
        <div class="m3-menu" id="displayMenu" hidden>
          <button role="option" data-value="auto"><svg viewBox="0 0 24 24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg><span>Automatic (prefer Wayland)</span></button>
          <button role="option" data-value="wayland"><svg viewBox="0 0 24 24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg><span>Wayland</span></button>
          <button role="option" data-value="x11"><svg viewBox="0 0 24 24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg><span>X11 / XWayland</span></button>
        </div>
      </div>
    </div>
  </section>
  <section data-page="appearance" hidden>
    <div class="card caption">Custom CSS</div>
    <p class="hint">~/.config/ruwa/custom.css — reload the page to apply edits.</p>
    <textarea id="css" spellcheck="false"></textarea>
    <button id="saveCss" class="primary">Save custom CSS</button>
  </section>
  <section data-page="plugins" hidden>
    <div class="card caption">Plugins</div>
    <div id="plugins"></div>
  </section>
  <section data-page="system" hidden>
    <div class="card caption">Startup</div>
    <label class="row"><span>Start on login</span><input type="checkbox" id="autostart" /></label>
    <div class="card caption">Account</div>
    <button id="logout" class="danger">Log Out/button>
    <div class="card caption">About</div>
    <div class="card"><span id="version"></span></div>
  </section>
</main>
<script src="panel.js"></script>
</body>
</html>
