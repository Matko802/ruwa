<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root {
    color-scheme: light;
    --surface: #fef7ff;
    --on-surface: #1d1b20;
    --on-surface-variant: #49454f;
    --divider: #e0e0e0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --surface: #1d1f1f;
      --on-surface: #e2e7e3;
      --on-surface-variant: #a8b3a8;
      --divider: #343636;
    }
  }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--surface); color: var(--on-surface);
    font: 500 13px/1.4 Roboto, system-ui, "Segoe UI", sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  #bar {
    display: flex; align-items: center; gap: 2px;
    height: 40px; padding: 0 8px 0 12px;
    box-sizing: border-box;
    border-bottom: 1px solid var(--divider, transparent);
    -webkit-app-region: drag;
  }
  body.panel-open #bar { border-bottom-color: transparent; }
  #dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #25d366; margin-right: 8px; flex: none;
  }
  #logo {
    width: 20px; height: 20px; margin-right: 8px; flex: none;
  }
  #title {
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; max-width: 52vw;
    color: var(--on-surface-variant);
  }
  #spacer { flex: 1; }
  button {
    -webkit-app-region: no-drag;
    border: 0; border-radius: 50%; background: transparent;
    color: var(--on-surface-variant);
    width: 32px; height: 32px; font-size: 15px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
  }
  button:hover { background: color-mix(in srgb, var(--on-surface) 8%, transparent); }
  button svg { width: 20px; height: 20px; fill: currentColor; display: block; }
</style>
</head>
<body>
<div id="bar">
  <div id="dot"></div>
  <img id="logo" src="icon.png" alt="" onload="document.getElementById('dot').style.display='none'" onerror="this.style.display='none'" />
  <div id="title">Ruwa</div>
  <div id="spacer"></div>
  <button id="reload" title="Reload"><svg viewBox="0 0 24 24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>
  <button id="settings" title="Settings"><svg viewBox="0 0 24 24"><path d="M0 0h24v24H0V0z" fill="none"/><path d="M19.44 12.99l-.01.02c.04-.33.08-.67.08-1.01 0-.34-.03-.66-.07-.99l.01.02 2.44-1.92-2.43-4.22-2.87 1.16.01.01c-.52-.4-1.09-.74-1.71-1h.01L14.44 2H9.57l-.44 3.07h.01c-.62.26-1.19.6-1.71 1l.01-.01-2.88-1.17-2.44 4.22 2.44 1.92.01-.02c-.04.33-.07.65-.07.99 0 .34.03.68.08 1.01l-.01-.02-2.1 1.65-.33.26 2.43 4.2 2.88-1.15-.02-.04c.53.41 1.1.75 1.73 1.01h-.03L9.58 22h4.85s.03-.18.06-.42l.38-2.65h-.01c.62-.26 1.2-.6 1.73-1.01l-.02.04 2.88 1.15 2.43-4.2s-.14-.12-.33-.26l-2.11-1.66zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg></button>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  $('reload').onclick = () => window.ruwaBar.reload();
  $('settings').onclick = () => window.ruwaBar.toggleSettings();
  window.ruwaBar.onTitle((t) => {
    $('title').textContent = t && t.trim() ? t : 'Ruwa';
  });
  window.ruwaBar.onPanel((open) => {
    document.body.classList.toggle('panel-open', !!open);
  });
</script>
</body>
</html>
