[package]
name = "ruwa-tray"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Ruwa tray supervisor + settings (Neutron build companion)"
license = "GPL-3.0-only"

[[bin]]
name = "ruwa"
path = "src/main.rs"

[[bin]]
name = "ruwa-settings"
path = "src/bin/ruwa-settings.rs"

[workspace]

[dependencies]
ksni = { version = "0.3", features = ["blocking"] }
fs2 = "0.4"
gtk = { package = "gtk4", version = "0.9" }
