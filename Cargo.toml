[package]
name = "ruwa"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
description = "Ruwa WhatsApp desktop client (Tauri 2 + system WebKitGTK)"
license = "GPL-3.0-only"

[[bin]]
name = "ruwa"
path = "src/main.rs"

[[bin]]
name = "ruwa-settings"
path = "src/bin/ruwa-settings.rs"

[workspace]

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
webkit2gtk = { version = "2", features = ["v2_38"] }
gtk = { package = "gtk4", version = "0.9" }

[build-dependencies]
tauri-build = "2"
